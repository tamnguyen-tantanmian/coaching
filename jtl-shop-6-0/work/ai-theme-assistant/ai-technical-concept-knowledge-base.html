<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Technical Concept – Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#2722F8;--p-600:#1C18C9;--p-50:#EEEDFF;--p-100:#DCDBFE;--s:#E5E7EB;--h:#FB581F;--h-50:#FFF1EB;--h-100:#FFDCCB;
--ink:#111827;--ink-2:#374151;--muted:#6B7280;--line:#E5E7EB;--bg:#F9FAFB;--page:#F3F4F6;--card:#fff;--ok:#059669;--ok-50:#ECFDF5}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--page);font-size:14.5px;line-height:1.55}
code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:var(--p-50);color:var(--p-600);padding:1px 6px;border-radius:5px;white-space:nowrap}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}
.bar h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.btn.pr{background:var(--p);border-color:var(--p);color:#fff}
.btn.on{background:var(--h-50);border-color:var(--h);color:#B13A0C}
.chip{font-size:11.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:#9CA3AF}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--h)}
/* layout */
.layout{max-width:1480px;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:200px 1fr;gap:28px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 10px;border-radius:7px;display:flex;gap:8px}
.toc a b{color:#9CA3AF;font-weight:600;width:16px}
.toc a:hover,.toc a.on{background:#fff;color:var(--ink)}
.toc a.on b{color:var(--p)}
.hero{background:linear-gradient(135deg,var(--p) 0%,#4A46FF 60%,var(--h) 140%);color:#fff;border-radius:16px;padding:16px 22px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h2{margin:0;font-size:22px;letter-spacing:-.01em;flex:1;min-width:0}
.hero p{margin:0;opacity:.9;max-width:900px}
.hero a{color:#fff;opacity:.85;font-size:12.5px;white-space:nowrap}
.mirror{display:grid;gap:22px}
.mirror.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.mirror.two{grid-template-columns:1fr}}
.colhead{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--p);margin:0 0 8px;display:none}
.mirror.two .colhead{display:block}
section.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-n{width:26px;height:26px;border-radius:7px;background:var(--p-50);color:var(--p);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.sec h3{margin:0;font-size:19px;letter-spacing:-.01em}
.intro{color:var(--muted);margin:2px 0 14px}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
ul.bl{margin:8px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.bl li{position:relative;padding-left:18px}
ul.bl li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--p)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fact b{font-weight:600}
.tw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--bg);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.callout{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--p-50);border:1px solid var(--p-100);color:#1E1B7A;font-size:13.5px}
.code{margin-top:14px}
.code small{color:var(--muted);font-size:12.5px}
.code pre{margin:6px 0 0;background:var(--ink);color:#E5E7EB;border-radius:10px;padding:12px 14px;font-size:12.5px;overflow:auto}
/* swimlane */
.sw{overflow-x:auto;margin-top:8px}
.sw-g{display:grid;grid-template-columns:34px repeat(5,minmax(120px,1fr));min-width:680px;position:relative}
.sw-h{font-size:11.5px;font-weight:600;color:var(--ink-2);padding:8px;text-align:center;border-bottom:2px solid var(--line);background:var(--bg)}
.sw-h:first-child{background:none;border:0}
.sw-n{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.sw-n span{width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid #D1D5DB;display:grid;place-items:center;z-index:1}
.sw-n.seen span{border-color:var(--h);color:#B13A0C;background:var(--h-50)}
.sw-c{padding:5px;border-left:1px dashed var(--line)}
.sw-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sw-card.seen{border-color:var(--h);background:var(--h-50)}
.sw-card .eye{display:block;font-size:10.5px;font-weight:600;color:#B13A0C;margin-top:3px}
.sw-line{position:absolute;left:16px;top:40px;bottom:14px;width:2px;background:var(--line)}
/* arch */
.arch-w{overflow-x:auto;margin-top:6px}
.arch{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,auto);gap:52px 120px;padding:12px 8px 18px;min-width:960px}
.arch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:relative;z-index:1;border-radius:12px;padding:12px;text-align:center;font-weight:600;font-size:13px;border:1.5px solid var(--line);background:#fff;align-self:center}
.node.user{background:var(--ink);color:#fff;border-color:var(--ink)}
.node.ui{border-color:var(--p-100);background:var(--p-50);color:#1E1B7A}
.node.core{border-color:var(--p);color:var(--p)}
.node.ai{background:var(--p);color:#fff;border-color:var(--p)}
.node.store{background:var(--bg);border-style:dashed;color:var(--ink-2)}
.node.ext{border-color:var(--h);background:var(--h-50);color:#9A2D06}
.elab{position:absolute;z-index:2;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
/* flows */
.flows{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.flow{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flow .fh{display:flex;align-items:center;gap:10px}
.flow .fn{width:22px;height:22px;border-radius:6px;background:var(--p);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.flow .fh b{font-size:14.5px}
.pri{margin-left:auto;font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pri.must{background:var(--p-50);color:var(--p)}.pri.should{background:var(--h-50);color:#B13A0C}.pri.later{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.flow p{margin:3px 0 8px 32px;font-size:13px;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px 32px}
.stp{font-size:12.5px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:3px 9px}
.ar{color:#9CA3AF}
/* steps */
ol.steps{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 42px;position:relative;font-size:13px;background:#fff}
ol.steps li::before{content:counter(s);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:6px;background:var(--bg);color:var(--muted);font-weight:700;font-size:11px;display:grid;place-items:center}
ol.steps li.hl{border-color:var(--h);background:var(--h-50)}
ol.steps li.hl::before{background:var(--h);color:#fff}
/* editing */
body.editing [data-p]{outline:1px dashed transparent;border-radius:3px;cursor:text;transition:outline-color .15s}
body.editing [data-p]:hover{outline-color:var(--p-100)}
body.editing [data-p]:focus{outline:2px solid var(--p);background:#fff;color:var(--ink)}
.stale{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--h);margin-left:4px;vertical-align:middle}
.flash{animation:fl 1.2s}
@keyframes fl{0%{background:var(--h-100)}100%{background:transparent}}
.editbar{display:none;max-width:1480px;margin:0 auto;padding:8px 20px;font-size:12.5px;color:#7C2D12;background:var(--h-50);border-top:1px solid var(--h-100)}
body.editing .editbar{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#fff}}
.st{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.built{background:var(--ok-50);color:var(--ok)}.st.gap{background:var(--h-50);color:#B13A0C}.st.ai{background:var(--p-50);color:var(--p)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:14px}
.keys>span{display:inline-flex;gap:8px;align-items:center}
ol.turn{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:12px}
ol.turn li{display:grid;grid-template-columns:26px 120px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
ol.turn li:first-child{border-top:0}
ol.turn .tn{font-weight:700;color:var(--p)}
ol.turn p{margin:0;font-size:13.5px}
.who{justify-self:start;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;white-space:nowrap}
.who.mer{background:var(--ink);color:#fff}.who.fe{background:var(--p-50);color:var(--p)}.who.ai{background:var(--p);color:#fff}.who.be{box-shadow:inset 0 0 0 1.5px var(--p);color:var(--p)}
@media(max-width:640px){ol.turn li{grid-template-columns:22px 1fr}ol.turn p{grid-column:2}}
</style>
</head>

ng, bản nháp, lưu, publish và version hoạt động như hiện tại, kể cả khi AI bị lỗi."}}, {"b": {"en": "Target user", "vi": "Người dùng mục tiêu"}, "t": {"en": "Merchant admin or staff who has permission to configure the storefront layout.", "vi": "Admin hoặc nhân viên của merchant có quyền cấu hình layout của storefront."}}]}, {"type": "facts", "items": [{"k": {"en": "Decision status", "vi": "Trạng thái quyết định"}, "v": {"en": "Proposed", "vi": "Đề xuất"}}, {"k": {"en": "Delivery status", "vi": "Trạng thái triển khai"}, "v": {"en": "In progress", "vi": "Đang thực hiện"}}, {"k": {"en": "Decision owner", "vi": "Người quyết định"}, "v": "Thanh Hoang"}, {"k": {"en": "Reviewers", "vi": "Người review"}, "v": "Manh Pham, Frank Nguyen"}, {"k": {"en": "AI runtime", "vi": "Nền tảng AI"}, "v": {"en": "JTL AI Gateway", "vi": "JTL AI Gateway"}}, {"k": {"en": "Integration testing", "vi": "Test tích hợp"}, "v": {"en": "Planned for November 2026", "vi": "Dự kiến tháng 11/2026"}}]}]}, {"id": "flow", "nav": {"en": "Request flow", "vi": "Luồng xử lý"}, "title": {"en": "How a request works", "vi": "Một yêu cầu được xử lý thế nào"}, "intro": {"en": "The merchant only sees the highlighted steps. Everything else happens in the background.", "vi": "Merchant chỉ thấy các bước được đánh dấu. Mọi thứ khác diễn ra ở phía sau."}, "blocks": [{"type": "swimlane", "lanes": [{"id": "m", "label": {"en": "Merchant", "vi": "Merchant"}}, {"id": "fe", "label": {"en": "Theme setup (frontend)", "vi": "Theme setup (frontend)"}}, {"id": "be", "label": {"en": "Admin backend", "vi": "Admin backend"}}, {"id": "ai", "label": {"en": "AI (LLM)", "vi": "AI (LLM)"}}, {"id": "mcp", "label": {"en": "Theme Builder MCP", "vi": "Theme Builder MCP"}}], "seenLabel": {"en": "Merchant sees this", "vi": "Merchant nhìn thấy"}, "steps": [{"lane": "m", "seen": true, "t": {"en": "Types a request, optionally with an image", "vi": "Nhập yêu cầu, có thể kèm hình ảnh"}}, {"lane": "fe", "t": {"en": "Sends the request with pageId + version (not the full page)", "vi": "Gửi yêu cầu kèm pageId + version (không gửi cả trang)"}}, {"lane": "be", "t": {"en": "Checks permission and starts the AI session", "vi": "Kiểm tra quyền và khởi động phiên AI"}}, {"lane": "ai", "t": {"en": "Reads the request: target, property, adjustment", "vi": "Đọc yêu cầu: đối tượng, thuộc tính, mức điều chỉnh"}}, {"lane": "mcp", "t": {"en": "Checks the field exists and is editable. If not: ask a question or say it can't", "vi": "Kiểm tra field có tồn tại và chỉnh sửa được không. Nếu không: hỏi lại hoặc báo không làm được"}}, {"lane": "mcp", "t": {"en": "Reads only the current values and limits it needs", "vi": "Chỉ đọc giá trị hiện tại và giới hạn cần thiết"}}, {"lane": "ai", "t": {"en": "Proposes new values as one complete change set", "vi": "Đề xuất giá trị mới thành một nhóm thay đổi hoàn chỉnh"}}, {"lane": "mcp", "t": {"en": "Validates the whole change set", "vi": "Kiểm tra toàn bộ nhóm thay đổi"}}, {"lane": "fe", "seen": true, "t": {"en": "Shows the proposal for review", "vi": "Hiển thị đề xuất để xem lại"}}, {"lane": "m", "seen": true, "t": {"en": "Confirms with Apply (nothing is saved before this)", "vi": "Xác nhận bằng Apply (không có gì được lưu trước bước này)"}}, {"lane": "be", "t": {"en": "Checks again, applies and saves the draft", "vi": "Kiểm tra lại, áp dụng và lưu bản nháp"}}, {"lane": "fe", "seen": true, "t": {"en": "Refreshes the editor and shows the result", "vi": "Làm mới editor và hiển thị kết quả"}}]}, {"type": "code", "caption": {"en": "Example: how the AI turns “make the buttons rounder” into something the system can check", "vi": "Ví dụ: AI chuyển “bo tròn nút hơn” thành dữ liệu hệ thống có thể kiểm tra"}, "code": "{\n  \"target\": \"buttons\",\n  \"property\": \"radius\",\n  \"adjustment\": \"rounder\"\n}"}, {"type": "callout", "tone": "info", "t": {"en": "Image requests follow exactly the same path. The AI reads the image first (only if the model supports images), then the same checks, review and confirmation apply.", "vi": "Yêu cầu bằng hình ảnh đi đúng luồng này. AI đọc hình trước (chỉ khi model hỗ trợ hình ảnh), sau đó vẫn qua cùng các bước kiểm tra, xem lại và xác nhận."}}]}, {"id": "parts", "nav": {"en": "System parts", "vi": "Thành phần"}, "title": {"en": "System parts and who is in charge", "vi": "Các thành phần hệ thống và ai chịu trách nhiệm"}, "blocks": [{"type": "arch", "nodes": [{"id": "m", "r": 1, "c": 1, "k": "user", "l": {"en": "Merchant", "vi": "Merchant"}}, {"id": "fe", "r": 1, "c": 2, "k": "ui", "l": {"en": "Theme setup (frontend)", "vi": "Theme setup (frontend)"}}, {"id": "be", "r": 1, "c": 3, "k": "core", "l": {"en": "Admin backend", "vi": "Admin backend"}}, {"id": "db", "r": 1, "c": 4, "k": "store", "l": {"en": "Theme & page draft", "vi": "Bản nháp theme & trang"}}, {"id": "ai", "r": 2, "c": 3, "k": "ai", "l": {"en": "AI (LLM)", "vi": "AI (LLM)"}}, {"id": "ext", "r": 3, "c": 1, "k": "ext", "l": {"en": "External AI agents", "vi": "AI agent bên ngoài"}}, {"id": "mcp", "r": 3, "c": 2, "k": "ai", "l": {"en": "Theme Builder MCP", "vi": "Theme Builder MCP"}}, {"id": "reg", "r": 3, "c": 3, "k": "store", "l": {"en": "Theme field registry", "vi": "Danh mục field của theme"}}, {"id": "tok", "r": 3, "c": 4, "k": "store", "l": {"en": "Token contract", "vi": "Token contract"}}], "edges": [{"a": "m", "b": "fe", "l": {"en": "prompt + image", "vi": "prompt + hình"}}, {"a": "fe", "b": "be", "l": {"en": "request + pageId + version", "vi": "yêu cầu + pageId + version"}}, {"a": "be", "b": "db", "l": {"en": "saves after Apply", "vi": "lưu sau khi Apply"}}, {"a": "be", "b": "ai", "l": {"en": "starts session", "vi": "khởi động phiên"}}, {"a": "ai", "b": "mcp", "l": {"en": "tool calls", "vi": "gọi công cụ"}}, {"a": "ext", "b": "mcp", "l": {"en": "same tools", "vi": "cùng công cụ"}}, {"a": "mcp", "b": "reg", "l": {"en": "find fields", "vi": "tìm field"}}, {"a": "reg", "b": "tok", "l": {"en": "allowed values", "vi": "giá trị cho phép"}}]}, {"type": "table", "cols": [{"en": "Part", "vi": "Thành phần"}, {"en": "What it does", "vi": "Vai trò"}], "rows": [[{"en": "Theme setup (frontend)", "vi": "Theme setup (frontend)"}, {"en": "Captures the prompt and image, sends them with pageId and version, shows the proposal, asks for confirmation.", "vi": "Nhận prompt và hình ảnh, gửi kèm pageId và version, hiển thị đề xuất, yêu cầu xác nhận."}], [{"en": "Admin backend", "vi": "Admin backend"}, {"en": "Checks permission, starts the AI, re-checks the proposal, applies it after confirmation and saves the draft.", "vi": "Kiểm tra quyền, khởi động AI, kiểm tra lại đề xuất, áp dụng sau khi xác nhận và lưu bản nháp."}], [{"en": "AI (LLM)", "vi": "AI (LLM)"}, {"en": "Understands the request, picks the fields to change and proposes new values.", "vi": "Hiểu yêu cầu, chọn field cần thay đổi và đề xuất giá trị mới."}], [{"en": "Theme Builder MCP", "vi": "Theme Builder MCP"}, {"en": "A fixed set of tools the AI must use to find, read and check fields. It never saves anything.", "vi": "Bộ công cụ cố định mà AI bắt buộc dùng để tìm, đọc và kiểm tra field. Không bao giờ lưu dữ liệu."}], [{"en": "Theme field registry", "vi": "Danh mục field của theme"}, {"en": "Maps merchant words (“buttons”, “rounder”) to real editable fields.", "vi": "Ánh xạ từ ngữ của merchant (“nút”, “bo tròn hơn”) sang field thật có thể chỉnh sửa."}], [{"en": "Token contract", "vi": "Token contract"}, {"en": "Defines which theme and layout values exist and which values are allowed.", "vi": "Quy định những giá trị theme và layout nào tồn tại và giá trị nào được phép."}]]}, {"type": "bullets", "title": {"en": "Who is in charge", "vi": "Ai chịu trách nhiệm"}, "items": [{"t": {"en": "The frontend never talks to the AI directly. Everything goes through the backend.", "vi": "Frontend không bao giờ gọi AI trực tiếp. Mọi thứ đều đi qua backend."}}, {"t": {"en": "The AI never sees the full page. It gets pageId and version and asks only for the values it needs.", "vi": "AI không bao giờ thấy toàn bộ trang. AI nhận pageId và version, và chỉ hỏi những giá trị cần thiết."}}, {"t": {"en": "The AI proposes, the MCP checks, and only the backend saves.", "vi": "AI đề xuất, MCP kiểm tra, và chỉ backend được lưu."}}, {"t": {"en": "External AI agents can't skip validation or merchant confirmation.", "vi": "AI agent bên ngoài không thể bỏ qua bước kiểm tra hay xác nhận của merchant."}}, {"t": {"en": "Allowed values come from the token contract, so adding or changing a token doesn't need AI code changes.", "vi": "Giá trị cho phép lấy từ token contract, nên thêm hoặc sửa token không cần sửa code AI."}}]}]}, {"id": "tools", "nav": {"en": "AI tools (MCP)", "vi": "Công cụ AI (MCP)"}, "title": {"en": "The five AI tools and what they mean for the UI", "vi": "Năm công cụ AI và ý nghĩa với UI"}, "intro": {"en": "The AI can only act through these tools. None of them saves anything.", "vi": "AI chỉ có thể hành động thông qua các công cụ này. Không công cụ nào lưu dữ liệu."}, "blocks": [{"type": "table", "cols": [{"en": "Tool", "vi": "Công cụ"}, {"en": "What it does", "vi": "Chức năng"}, {"en": "Where it shows in the UI", "vi": "Thể hiện trên UI"}], "rows": [["`get_theme_builder_capabilities`", {"en": "Tells the AI what it may do, the limits and the rules.", "vi": "Cho AI biết được làm gì, giới hạn và quy tắc."}, {"en": "Not visible", "vi": "Không hiển thị"}], ["`list_theme_fields`", {"en": "Lists every editable theme and layout field with its allowed values.", "vi": "Liệt kê mọi field theme và layout có thể chỉnh sửa cùng giá trị cho phép."}, {"en": "Could power suggestions or “what can I change?”", "vi": "Có thể dùng cho gợi ý hoặc “tôi có thể đổi gì?”"}], ["`validate_theme_field_mapping`", {"en": "Checks the AI understood a real, editable field. Returns `valid`, `needs_clarification` or `not_supported`.", "vi": "Kiểm tra AI đã hiểu đúng một field thật và chỉnh sửa được. Trả về `valid`, `needs_clarification` hoặc `not_supported`."}, {"en": "Clarifying question or “can't do this” message", "vi": "Câu hỏi làm rõ hoặc thông báo “không làm được”"}], ["`read_theme_values`", {"en": "Reads only the current values and limits for those fields.", "vi": "Chỉ đọc giá trị hiện tại và giới hạn của các field đó."}, {"en": "The “before” values in the proposal card", "vi": "Giá trị “trước” trong thẻ đề xuất"}], ["`validate_theme_changes`", {"en": "Checks the whole proposed change set.", "vi": "Kiểm tra toàn bộ nhóm thay đổi được đề xuất."}, {"en": "Valid → proposal card. Errors → no Apply button", "vi": "Hợp lệ → thẻ đề xuất. Lỗi → không có nút Apply"}]]}]}, {"id": "rules", "nav": {"en": "UI rules", "vi": "Quy tắc UI"}, "title": {"en": "Rules that shape the UI", "vi": "Các quy tắc ảnh hưởng đến UI"}, "blocks": [{"type": "bullets", "items": [{"b": {"en": "Nothing applies without confirmation.", "vi": "Không áp dụng nếu chưa xác nhận."}, "t": {"en": "Every proposal needs a review step and a clear Apply button.", "vi": "Mọi đề xuất cần bước xem lại và nút Apply rõ ràng."}}, {"b": {"en": "One request gives one complete set of changes.", "vi": "Một yêu cầu cho ra một nhóm thay đổi hoàn chỉnh."}, "t": {"en": "If any change in the set is invalid, the whole set is rejected, never half-applied.", "vi": "Nếu một thay đổi trong nhóm không hợp lệ, cả nhóm bị từ chối, không bao giờ áp dụng một nửa."}}, {"b": {"en": "Proposals can go out of date.", "vi": "Đề xuất có thể bị lỗi thời."}, "t": {"en": "If the page version changes before the merchant confirms, Apply is refused and a new proposal is needed.", "vi": "Nếu version của trang thay đổi trước khi merchant xác nhận, Apply sẽ bị từ chối và cần tạo đề xuất mới."}}, {"b": {"en": "Image input depends on the AI model.", "vi": "Upload hình ảnh phụ thuộc vào model AI."}, "t": {"en": "It only works if the model can read images, so the upload may need a disabled state.", "vi": "Tính năng này chỉ hoạt động nếu model đọc được hình ảnh, nên nút upload có thể cần trạng thái bị vô hiệu hóa."}}, {"b": {"en": "Requests are limited per shop.", "vi": "Số lượng yêu cầu bị giới hạn theo từng shop."}, "t": {"en": "You need a limit-reached state.", "vi": "Cần có state “đã hết lượt”."}}, {"b": {"en": "Failures leave the page untouched.", "vi": "Khi lỗi, trang được giữ nguyên."}, "t": {"en": "The design needs clear messages for an error, a timeout and an unreadable AI answer, while manual editing stays usable.", "vi": "Thiết kế cần thông báo rõ ràng cho lỗi, timeout và câu trả lời AI không đọc được, trong khi vẫn chỉnh sửa thủ công được."}}]}]}, {"id": "outcomes", "nav": {"en": "Outcomes", "vi": "Kết quả"}, "title": {"en": "Outcomes the UI must handle", "vi": "Các kết quả UI cần xử lý"}, "blocks": [{"type": "table", "cols": [{"en": "Outcome", "vi": "Kết quả"}, {"en": "UI need", "vi": "UI cần có"}], "rows": [[{"en": "Valid proposal", "vi": "Đề xuất hợp lệ"}, {"en": "Review + Apply", "vi": "Xem lại + Apply"}], ["`needs_clarification`", {"en": "AI asks a question", "vi": "AI đặt câu hỏi"}], ["`not_supported`", {"en": "Explain what it can't do", "vi": "Giải thích AI không làm được gì"}], [{"en": "Change fails validation", "vi": "Thay đổi không qua kiểm tra"}, {"en": "Error, no Apply button", "vi": "Báo lỗi, không có nút Apply"}], [{"en": "Version changed", "vi": "Version đã thay đổi"}, {"en": "Outdated → regenerate", "vi": "Lỗi thời → tạo lại đề xuất"}], [{"en": "AI error or timeout", "vi": "AI lỗi hoặc timeout"}, {"en": "Error + Retry", "vi": "Báo lỗi + Thử lại"}], [{"en": "Saving fails", "vi": "Lưu thất bại"}, {"en": "Error, previous draft kept", "vi": "Báo lỗi, giữ bản nháp trước đó"}], [{"en": "Rate limit", "vi": "Hết lượt"}, {"en": "Disabled input + wait message", "vi": "Ô nhập bị khóa + thông báo chờ"}]]}]}, {"id": "build", "nav": {"en": "Chat cases (build)", "vi": "Case chat (bản build)"}, "title": {"en": "Chat cases in the current build", "vi": "Các case chat trong bản build hiện tại"}, "intro": {"en": "From “AI Theme Chat Cases”, taken from the current chat panel code and the AI's rules. Gap marks a case the build handles poorly or not at all, which is where design input is most needed.", "vi": "Từ tài liệu “AI Theme Chat Cases”, lấy từ code chat panel hiện tại và các quy tắc của AI. Thiếu là case bản build xử lý chưa tốt hoặc chưa có, đây là chỗ cần design nhất."}, "blocks": [{"type": "turn", "title": {"en": "One chat turn, step by step", "vi": "Một lượt chat, từng bước"}, "items": [{"who": "mer", "w": {"en": "Merchant", "vi": "Merchant"}, "t": {"en": "Writes a request and can attach up to 6 PNG or JPEG images. Each image uploads as soon as it is attached.", "vi": "Viết yêu cầu và có thể đính kèm tối đa 6 hình PNG hoặc JPEG. Mỗi hình được tải lên ngay khi đính kèm."}}, {"who": "fe", "w": {"en": "Frontend", "vi": "Frontend"}, "t": {"en": "Sends the text and image ids. The backend checks access and saves the message.", "vi": "Gửi text và id của hình. Backend kiểm tra quyền và lưu tin nhắn."}}, {"who": "ai", "w": {"en": "AI agent", "vi": "AI agent"}, "t": {"en": "Looks up which fields match, reads their current values and checks the new ones. Each step streams to the chat as progress.", "vi": "Tìm field phù hợp, đọc giá trị hiện tại và kiểm tra giá trị mới. Mỗi bước được stream vào chat để hiển thị tiến độ."}}, {"who": "be", "w": {"en": "Backend", "vi": "Backend"}, "t": {"en": "Re-checks the AI result and sends back one of three things: a proposal, a question, or an error.", "vi": "Kiểm tra lại kết quả của AI và trả về một trong ba thứ: đề xuất, câu hỏi, hoặc lỗi."}}, {"who": "mer", "w": {"en": "Merchant", "vi": "Merchant"}, "t": {"en": "Applies the proposal to the editor draft, answers the question, or tries again. Saving the theme stays a separate step in the editor.", "vi": "Apply đề xuất vào bản nháp của editor, trả lời câu hỏi, hoặc thử lại. Lưu theme vẫn là một bước riêng trong editor."}}]}, {"type": "keys", "items": [{"st": "built", "t": {"en": "exists in the UI today", "vi": "đã có trong UI"}}, {"st": "gap", "t": {"en": "missing or weak, needs design", "vi": "chưa có hoặc còn yếu, cần design"}}, {"st": "ai", "t": {"en": "handled only by what the AI writes", "vi": "chỉ xử lý bằng nội dung AI viết"}}]}, {"type": "table", "title": {"en": "A. Opening the chat", "vi": "A. Mở chat"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Empty, new chat", "vi": "Trống, chat mới"}, {"en": "First open, or after End chat.", "vi": "Lần mở đầu tiên, hoặc sau khi End chat."}, {"en": "Sparkle icon, “Chat with the theme assistant”, one line on how Apply works, three example prompts. Clicking an example sends it straight away.", "vi": "Icon sparkle, “Chat with the theme assistant”, một dòng giải thích Apply, ba prompt mẫu. Nhấn vào prompt mẫu sẽ gửi ngay."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "No theme version", "vi": "Chưa chọn theme version"}, {"en": "No theme version is selected in the editor.", "vi": "Chưa chọn theme version trong editor."}, {"en": "Input, examples and choices disabled. Hint under the input: “Pick a theme version to start chatting.”", "vi": "Ô nhập, prompt mẫu và lựa chọn bị khóa. Gợi ý dưới ô nhập: “Pick a theme version to start chatting.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Session resumed", "vi": "Tiếp tục phiên"}, {"en": "Session id is in the URL (reload, shared link).", "vi": "Session id có trong URL (tải lại trang, link được chia sẻ)."}, {"en": "History loads. Older messages load when scrolling up, with a loading state.", "vi": "Lịch sử được tải. Tin nhắn cũ hơn tải khi cuộn lên, có trạng thái loading."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Session can't load", "vi": "Không tải được phiên"}, {"en": "History request fails.", "vi": "Yêu cầu tải lịch sử bị lỗi."}, {"en": "Red banner with Retry. The link is kept. “Couldn't load this chat session. The link is kept so you can retry once the assistant is reachable again.”", "vi": "Banner đỏ có nút Retry. Link được giữ lại. “Couldn't load this chat session. The link is kept so you can retry once the assistant is reachable again.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Session gone", "vi": "Phiên không còn"}, {"en": "Session was ended, or the user has no access to it.", "vi": "Phiên đã kết thúc, hoặc người dùng không có quyền truy cập."}, {"en": "Silently drops the old link and shows a new empty chat. No message.", "vi": "Âm thầm bỏ link cũ và hiển thị chat trống mới. Không có thông báo."}, {"en": "Built", "vi": "Đã có", "st": "built"}]]}, {"type": "table", "title": {"en": "B. Writing a message", "vi": "B. Viết tin nhắn"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Typing", "vi": "Đang nhập"}, {"en": "Merchant writes a request.", "vi": "Merchant viết yêu cầu."}, {"en": "Send enabled as soon as there is text. Text is always required.", "vi": "Nút gửi bật ngay khi có text. Luôn bắt buộc có text."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Images attached", "vi": "Đã đính kèm hình"}, {"en": "Merchant adds PNG or JPEG files.", "vi": "Merchant thêm file PNG hoặc JPEG."}, {"en": "Square thumbnails above the input, labelled Image 1 to Image 6 in order. Remove button on hover or focus.", "vi": "Thumbnail vuông phía trên ô nhập, đánh nhãn Image 1 đến Image 6 theo thứ tự. Nút xóa hiện khi hover hoặc focus."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Image uploading", "vi": "Hình đang tải lên"}, {"en": "Right after attaching.", "vi": "Ngay sau khi đính kèm."}, {"en": "Skeleton on the tile. Send disabled until every upload finished.", "vi": "Skeleton trên ô hình. Nút gửi bị khóa cho đến khi tải xong tất cả."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Upload failed", "vi": "Tải lên thất bại"}, {"en": "Network or server error on one image.", "vi": "Lỗi mạng hoặc server với một hình."}, {"en": "Error icon on that tile. The merchant removes it and can still send the rest.", "vi": "Icon lỗi trên ô hình đó. Merchant xóa hình đó và vẫn gửi được các hình còn lại."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "File refused", "vi": "File bị từ chối"}, {"en": "7th image, WebP/GIF/HEIC, over 5 MB, or over 8 MB together.", "vi": "Hình thứ 7, WebP/GIF/HEIC, trên 5 MB, hoặc tổng trên 8 MB."}, {"en": "Notice naming each refused file and the reason (e.g. “up to 6 images”). Accepted files stay.", "vi": "Thông báo nêu tên từng file bị từ chối và lý do (vd. “up to 6 images”). File hợp lệ được giữ lại."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Images, no text", "vi": "Có hình, không có text"}, {"en": "Text cleared while images are attached.", "vi": "Xóa hết text khi đang có hình đính kèm."}, {"en": "Send disabled. No hint explains why.", "vi": "Nút gửi bị khóa. Không có gợi ý giải thích lý do."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}], [{"en": "Reply in progress", "vi": "Đang trả lời"}, {"en": "A turn is running.", "vi": "Một lượt chat đang chạy."}, {"en": "Input, examples and question choices disabled. There is no Stop button; only End chat cancels.", "vi": "Ô nhập, prompt mẫu và lựa chọn câu hỏi bị khóa. Không có nút Stop; chỉ End chat mới hủy được."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}]]}, {"type": "table", "title": {"en": "C. Waiting for the reply", "vi": "C. Chờ câu trả lời"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Thinking", "vi": "Đang suy nghĩ"}, {"en": "Turn started, nothing streamed yet.", "vi": "Lượt chat đã bắt đầu, chưa có gì được stream."}, {"en": "Assistant bubble with three bouncing dots.", "vi": "Bong bóng trợ lý với ba chấm nhảy."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Tool progress", "vi": "Tiến độ công cụ"}, {"en": "The AI calls a tool (find fields, read values, validate).", "vi": "AI gọi một công cụ (tìm field, đọc giá trị, kiểm tra)."}, {"en": "Same bubble with a wrench icon and the raw tool name plus a label, e.g. `read_theme_values`. Needs a design call: friendly step names or hide tools.", "vi": "Cùng bong bóng với icon cờ lê và tên công cụ thô kèm nhãn, vd. `read_theme_values`. Cần design quyết định: đặt tên bước dễ hiểu hoặc ẩn công cụ."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}]]}, {"type": "table", "title": {"en": "D. The AI answers", "vi": "D. AI trả lời"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Proposal", "vi": "Đề xuất"}, {"en": "AI found fields and valid values.", "vi": "AI tìm được field và giá trị hợp lệ."}, {"en": "Card with a short rationale and one row per change: colour swatch for colours, current value → new value (current hidden when unknown or equal), and “Apply changes”.", "vi": "Thẻ có lý do ngắn và mỗi thay đổi một dòng: ô màu cho màu sắc, giá trị hiện tại → giá trị mới (ẩn giá trị hiện tại khi không biết hoặc bằng nhau), và nút “Apply changes”."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Proposal applied", "vi": "Đã Apply đề xuất"}, {"en": "Merchant clicks Apply changes.", "vi": "Merchant nhấn Apply changes."}, {"en": "All changes go into the editor draft and the preview updates. Button turns into a disabled “Applied”. The next turn tells the AI what was applied.", "vi": "Toàn bộ thay đổi vào bản nháp của editor và preview cập nhật. Nút chuyển thành “Applied” bị khóa. Lượt sau sẽ báo cho AI những gì đã được áp dụng."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Apply only some changes", "vi": "Chỉ Apply một phần"}, {"en": "Merchant likes 2 of 3 changes.", "vi": "Merchant chỉ thích 2 trong 3 thay đổi."}, {"en": "Not possible. Apply is all or nothing.", "vi": "Không làm được. Apply là tất cả hoặc không."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}], [{"en": "Undo an applied proposal", "vi": "Undo đề xuất đã Apply"}, {"en": "Merchant changes their mind.", "vi": "Merchant đổi ý."}, {"en": "No undo in the chat. Only editing the fields by hand or not saving.", "vi": "Chat không có undo. Chỉ có thể sửa field bằng tay hoặc không lưu."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}], [{"en": "Question with options", "vi": "Câu hỏi có lựa chọn"}, {"en": "Target or value is unclear, e.g. which page, which shade.", "vi": "Đối tượng hoặc giá trị chưa rõ, vd. trang nào, sắc độ nào."}, {"en": "Card “Needs your input”, optional category and field badges, answer pills. A pill sends that answer as the next message. Afterwards: “Answered” with the choice shown.", "vi": "Thẻ “Needs your input”, có thể kèm badge category và field, các pill trả lời. Nhấn pill sẽ gửi câu trả lời đó thành tin nhắn tiếp theo. Sau đó: “Answered” kèm lựa chọn."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Question without options", "vi": "Câu hỏi không có lựa chọn"}, {"en": "AI needs a free answer.", "vi": "AI cần câu trả lời tự do."}, {"en": "Same card without pills. The merchant replies in the input.", "vi": "Cùng thẻ nhưng không có pill. Merchant trả lời trong ô nhập."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Can't be changed here", "vi": "Không đổi được ở đây"}, {"en": "Nothing in the request maps to an editable field, e.g. the footer text.", "vi": "Không có gì trong yêu cầu khớp với field chỉnh sửa được, vd. text ở footer."}, {"en": "Question card with no options that explains it, e.g. “The footer text has no editable theme setting, so it cannot be changed here.” Reads like a question though it is a refusal.", "vi": "Thẻ câu hỏi không có lựa chọn để giải thích, vd. “The footer text has no editable theme setting, so it cannot be changed here.” Trông như câu hỏi dù thực chất là từ chối."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}], [{"en": "Partly possible", "vi": "Làm được một phần"}, {"en": "Some parts are editable, some are not.", "vi": "Một số phần chỉnh sửa được, một số không."}, {"en": "Normal proposal. The rationale names what could not be changed.", "vi": "Đề xuất bình thường. Phần lý do nêu những gì không đổi được."}, {"en": "AI text", "vi": "Do AI viết", "st": "ai"}], [{"en": "Page named, setting is global", "vi": "Nêu tên trang, nhưng thiết lập là toàn cục"}, {"en": "“Make the category page background red”.", "vi": "“Make the category page background red”."}, {"en": "Normal proposal. The rationale says the change applies to all pages.", "vi": "Đề xuất bình thường. Phần lý do nói thay đổi áp dụng cho tất cả trang."}, {"en": "AI text", "vi": "Do AI viết", "st": "ai"}], [{"en": "Other language", "vi": "Ngôn ngữ khác"}, {"en": "Merchant writes in German, etc.", "vi": "Merchant viết bằng tiếng Đức, v.v."}, {"en": "AI replies in that language. UI labels stay in English.", "vi": "AI trả lời bằng ngôn ngữ đó. Nhãn UI vẫn giữ tiếng Anh."}, {"en": "AI text", "vi": "Do AI viết", "st": "ai"}]]}, {"type": "table", "title": {"en": "E. Errors", "vi": "E. Lỗi"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Image can't be used", "vi": "Không dùng được hình"}, {"en": "Image missing, expired, not a real PNG/JPEG, or too large.", "vi": "Hình bị thiếu, hết hạn, không phải PNG/JPEG thật, hoặc quá lớn."}, {"en": "“An image couldn't be used. Send PNG or JPEG images up to 5 MB each and 8 MB together, then try again.”", "vi": "“An image couldn't be used. Send PNG or JPEG images up to 5 MB each and 8 MB together, then try again.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Reply didn't validate", "vi": "Câu trả lời không qua kiểm tra"}, {"en": "AI result failed the backend re-check.", "vi": "Kết quả của AI không qua bước kiểm tra lại của backend."}, {"en": "“The assistant's reply didn't fit the theme contract.” This title is technical for merchants.", "vi": "“The assistant's reply didn't fit the theme contract.” Tiêu đề này quá kỹ thuật với merchant."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}], [{"en": "Took too long", "vi": "Quá lâu"}, {"en": "Turn hit the server time limit.", "vi": "Lượt chat vượt giới hạn thời gian của server."}, {"en": "“The assistant took too long. The turn exceeded the server timeout. Try again in a moment.”", "vi": "“The assistant took too long. The turn exceeded the server timeout. Try again in a moment.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Turn already running", "vi": "Lượt chat đang chạy"}, {"en": "Same chat open in a second tab.", "vi": "Cùng chat được mở ở tab thứ hai."}, {"en": "“A turn is already streaming. Wait for the current reply to finish, or end this chat and start a new one.”", "vi": "“A turn is already streaming. Wait for the current reply to finish, or end this chat and start a new one.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Network error", "vi": "Lỗi mạng"}, {"en": "Connection dropped.", "vi": "Mất kết nối."}, {"en": "“The assistant could not be reached. Try again in a moment.”", "vi": "“The assistant could not be reached. Try again in a moment.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Anything else", "vi": "Lỗi khác"}, {"en": "Unknown server error.", "vi": "Lỗi server không xác định."}, {"en": "“The assistant couldn't finish this turn. Try again, or end this chat and start a new one.”", "vi": "“The assistant couldn't finish this turn. Try again, or end this chat and start a new one.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "No retry button", "vi": "Không có nút thử lại"}, {"en": "Any error above.", "vi": "Bất kỳ lỗi nào ở trên."}, {"en": "The merchant has to retype or resend the message by hand.", "vi": "Merchant phải gõ lại hoặc gửi lại tin nhắn bằng tay."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}]]}, {"type": "table", "title": {"en": "F. History and images", "vi": "F. Lịch sử và hình ảnh"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "Sent images", "vi": "Hình đã gửi"}, {"en": "Right after sending and after reload.", "vi": "Ngay sau khi gửi và sau khi tải lại trang."}, {"en": "Thumbnails on the merchant's message, same order. Shown immediately, before the server answers.", "vi": "Thumbnail trên tin nhắn của merchant, cùng thứ tự. Hiển thị ngay, trước khi server trả lời."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Open image", "vi": "Mở hình"}, {"en": "Click a thumbnail.", "vi": "Nhấn vào thumbnail."}, {"en": "Larger view that can be closed.", "vi": "Xem lớn hơn, có thể đóng."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Image missing", "vi": "Hình bị thiếu"}, {"en": "Thumbnail can't load later.", "vi": "Thumbnail không tải được về sau."}, {"en": "Neutral placeholder instead of a broken image.", "vi": "Placeholder trung tính thay vì hình bị lỗi."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Follow-up turn", "vi": "Lượt tiếp theo"}, {"en": "Next message after an image turn.", "vi": "Tin nhắn kế tiếp sau lượt có hình."}, {"en": "The AI no longer sees the images, only a note that some were sent. It may ask the merchant to attach them again.", "vi": "AI không còn thấy hình, chỉ có ghi chú là đã gửi hình. AI có thể yêu cầu merchant đính kèm lại."}, {"en": "AI text", "vi": "Do AI viết", "st": "ai"}]]}, {"type": "table", "title": {"en": "G. Ending and saving", "vi": "G. Kết thúc và lưu"}, "cols": [{"en": "Case", "vi": "Case"}, {"en": "When it happens", "vi": "Khi nào xảy ra"}, {"en": "What the UI shows today", "vi": "UI hiện tại hiển thị gì"}, {"en": "Status", "vi": "Trạng thái"}], "rows": [[{"en": "End chat", "vi": "End chat"}, {"en": "Header button, shown once a session exists.", "vi": "Nút trên header, hiện khi đã có phiên."}, {"en": "Ends the session, clears messages and attachments, back to the empty state.", "vi": "Kết thúc phiên, xóa tin nhắn và file đính kèm, quay về trạng thái trống."}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "End chat failed", "vi": "End chat thất bại"}, {"en": "Server didn't confirm.", "vi": "Server không xác nhận."}, {"en": "Red banner with Retry. “Couldn't end this chat. Try again, or refresh the page to recover the session.”", "vi": "Banner đỏ có nút Retry. “Couldn't end this chat. Try again, or refresh the page to recover the session.”"}, {"en": "Built", "vi": "Đã có", "st": "built"}], [{"en": "Applied but not saved", "vi": "Đã Apply nhưng chưa lưu"}, {"en": "Merchant applied proposals and leaves the editor.", "vi": "Merchant đã Apply đề xuất rồi rời editor."}, {"en": "Handled by the editor's normal Save, not by the chat. The chat gives no reminder to save.", "vi": "Do nút Save thông thường của editor xử lý, không phải chat. Chat không nhắc lưu."}, {"en": "Gap", "vi": "Thiếu", "st": "gap"}]]}, {"type": "bullets", "title": {"en": "Rules the design must keep", "vi": "Quy tắc thiết kế phải giữ"}, "items": [{"t": {"en": "The AI only proposes. Nothing changes until the merchant presses Apply, and nothing is stored until they save the theme.", "vi": "AI chỉ đề xuất. Không có gì thay đổi cho đến khi merchant nhấn Apply, và không có gì được lưu cho đến khi họ lưu theme."}}, {"t": {"en": "Every reply is exactly one of: proposal, question, error. There is no plain text answer.", "vi": "Mỗi câu trả lời là đúng một trong: đề xuất, câu hỏi, lỗi. Không có câu trả lời dạng text thuần."}}, {"t": {"en": "The AI can only touch fields the token catalog marks as editable. Anything else gets a “can't be changed here” reply.", "vi": "AI chỉ được động đến field mà token catalog đánh dấu là chỉnh sửa được. Mọi thứ khác nhận câu trả lời “không đổi được ở đây”."}}, {"t": {"en": "Images go to the AI only in the turn they were sent with.", "vi": "Hình chỉ được gửi cho AI trong lượt chat mà chúng được gửi kèm."}}, {"t": {"en": "Limits: 6 images per message, PNG or JPEG, 5 MB each, 8 MB together. Text is always required.", "vi": "Giới hạn: 6 hình mỗi tin nhắn, PNG hoặc JPEG, mỗi hình 5 MB, tổng 8 MB. Luôn bắt buộc có text."}}]}, {"type": "table", "title": {"en": "Where the build differs from the technical concept", "vi": "Chỗ bản build khác với technical concept"}, "cols": [{"en": "Topic", "vi": "Chủ đề"}, {"en": "Technical concept", "vi": "Technical concept"}, {"en": "Current build", "vi": "Bản build hiện tại"}], "rows": [[{"en": "Apply and save", "vi": "Apply và lưu"}, {"en": "After confirmation, the backend applies the change set and saves the draft (FR-09).", "vi": "Sau khi xác nhận, backend áp dụng nhóm thay đổi và lưu bản nháp (FR-09)."}, {"en": "Apply puts the changes into the editor draft. Saving the theme is a separate step in the editor.", "vi": "Apply đưa thay đổi vào bản nháp của editor. Lưu theme là bước riêng trong editor."}], [{"en": "Reply types", "vi": "Loại câu trả lời"}, {"en": "Mapping results `valid`, `needs_clarification`, `not_supported`, plus validation errors.", "vi": "Kết quả ánh xạ `valid`, `needs_clarification`, `not_supported`, cùng lỗi kiểm tra."}, {"en": "Exactly one of proposal, question, error. “Not supported” is shown as a question card.", "vi": "Đúng một trong đề xuất, câu hỏi, lỗi. “Không hỗ trợ” được hiển thị bằng thẻ câu hỏi."}], [{"en": "Image limits", "vi": "Giới hạn hình ảnh"}, {"en": "Not specified.", "vi": "Không nêu."}, {"en": "6 images, PNG or JPEG, 5 MB each, 8 MB together.", "vi": "6 hình, PNG hoặc JPEG, mỗi hình 5 MB, tổng 8 MB."}], [{"en": "Version changed before confirmation", "vi": "Version thay đổi trước khi xác nhận"}, {"en": "Confirmation is rejected and a new proposal is required (§9).", "vi": "Việc xác nhận bị từ chối và cần đề xuất mới (§9)."}, {"en": "Not listed in the build's cases.", "vi": "Không có trong danh sách case của bản build."}]]}]}, {"id": "flows", "nav": {"en": "Flows to design", "vi": "Luồng cần thiết kế"}, "title": {"en": "Flows design needs to cover", "vi": "Các luồng design cần quan tâm"}, "intro": {"en": "Final list, based on the technical concept and the current build. “Design work” lists only what is missing or needs confirming.", "vi": "Bản chốt, dựa trên technical concept và bản build hiện tại. “Việc của design” chỉ ghi những chỗ còn thiếu hoặc cần xác nhận."}, "blocks": [{"type": "table", "cols": [{"en": "Flow", "vi": "Luồng"}, {"en": "Cases", "vi": "Gồm các case"}, {"en": "Design work", "vi": "Việc của design"}], "rows": [[{"en": "1. Opening the chat", "vi": "1. Mở chat"}, {"en": "Empty chat, no theme version, session resumed, session can't load, session gone", "vi": "Chat trống, chưa chọn theme version, tiếp tục phiên, không tải được phiên, phiên không còn"}, {"en": "All built; review the visuals only.", "vi": "Đã có đủ; chỉ cần rà lại giao diện."}], [{"en": "2. Writing a message + images", "vi": "2. Soạn tin nhắn + đính kèm hình"}, {"en": "Typing, images attached, uploading, upload failed, file refused", "vi": "Đang nhập, đính kèm hình, đang tải, tải lỗi, file bị từ chối"}, {"en": "Gap: images but no text disables Send without saying why.", "vi": "Thiếu: có hình nhưng không có text thì nút gửi bị khóa mà không giải thích lý do."}], [{"en": "3. Waiting for the reply", "vi": "3. Chờ trả lời"}, {"en": "Thinking, tool progress", "vi": "Đang suy nghĩ, tiến độ công cụ"}, {"en": "Gap: raw tool names (`read_theme_values`) need friendly names or hiding. Gap: no Stop button.", "vi": "Thiếu: tên công cụ đang hiện dạng thô (`read_theme_values`), cần đặt tên dễ hiểu hoặc ẩn đi. Thiếu: không có nút Stop."}], [{"en": "4. Proposal → Apply → Save ⭐", "vi": "4. Đề xuất → Apply → Save ⭐"}, {"en": "Proposal card, applied", "vi": "Thẻ đề xuất, đã Apply"}, {"en": "Gap: no reminder to Save after Apply. Partial apply and Undo are missing and go beyond the concept, so confirm before designing.", "vi": "Thiếu: chưa nhắc merchant Save sau khi Apply. Apply một phần và Undo cũng chưa có, và đều vượt ngoài concept nên cần xác nhận trước khi làm."}], [{"en": "5. AI asks back / can't do it", "vi": "5. AI hỏi lại / không làm được"}, {"en": "Question with options, question without options, can't be changed, partly possible, global setting", "vi": "Câu hỏi có lựa chọn, câu hỏi không có lựa chọn, không đổi được, làm được một phần, thiết lập toàn cục"}, {"en": "Gap: “can't be changed” is shown as a question; it needs its own display as a refusal.", "vi": "Thiếu: “Không đổi được” đang hiển thị như một câu hỏi, cần một dạng hiển thị riêng cho lời từ chối."}], [{"en": "6. Errors and recovery", "vi": "6. Lỗi và phục hồi"}, {"en": "Image can't be used, didn't validate, took too long, turn already running, network error, anything else", "vi": "Hình không dùng được, không qua kiểm tra, quá lâu, lượt chat đang chạy, lỗi mạng, lỗi khác"}, {"en": "Gap: no retry button. Gap: “didn't validate” copy is too technical. Not in the build but required by the concept: version changed before confirmation, saving fails, rate limit.", "vi": "Thiếu: không có nút thử lại. Thiếu: câu báo “không qua kiểm tra” quá kỹ thuật. Chưa có trong build (concept có yêu cầu): version thay đổi trước khi xác nhận, lưu thất bại, hết lượt."}], [{"en": "7. Ending the chat", "vi": "7. Kết thúc chat"}, {"en": "End chat, end chat failed", "vi": "End chat, End chat thất bại"}, {"en": "All built.", "vi": "Đã có đủ."}]]}, {"type": "steps", "title": {"en": "Priority", "vi": "Thứ tự ưu tiên"}, "items": [{"hl": true, "t": {"en": "Flow 4: the main path, and where merchants can lose changes by forgetting to Save.", "vi": "Luồng 4: luồng chính, và cũng là nơi có rủi ro mất thay đổi khi merchant quên Save."}}, {"hl": true, "t": {"en": "Flow 6: the most gaps, including 3 cases the concept requires and the build doesn't have.", "vi": "Luồng 6: nhiều case thiếu nhất, trong đó có 3 case concept yêu cầu mà bản build chưa có."}}, {"t": {"en": "Flows 5 and 3: mostly display and copy.", "vi": "Luồng 5 và luồng 3: chủ yếu là cách hiển thị và câu chữ."}}, {"t": {"en": "Flow 2: one small missing hint.", "vi": "Luồng 2: chỉ thiếu một gợi ý nhỏ."}}, {"t": {"en": "Flows 1 and 7: review only.", "vi": "Luồng 1 và luồng 7: chỉ cần rà lại."}}]}, {"type": "bullets", "title": {"en": "Not needed for now", "vi": "Chưa cần quan tâm lúc này"}, "items": [{"b": {"en": "External AI agents:", "vi": "External AI agent:"}, "t": {"en": "no UI in the chat panel.", "vi": "không có UI trong chat panel."}}, {"b": {"en": "Minimizing the panel and a chat history list:", "vi": "Thu nhỏ panel và danh sách lịch sử chat:"}, "t": {"en": "our own ideas, not in either document.", "vi": "ý tưởng của mình, không có trong cả hai tài liệu."}}, {"b": {"en": "Contrast warning:", "vi": "Cảnh báo tương phản:"}, "t": {"en": "our own idea, not in either document.", "vi": "ý tưởng của mình, không có trong cả hai tài liệu."}}]}]}, {"id": "beyond", "nav": {"en": "Beyond the spec", "vi": "Ngoài spec"}, "title": {"en": "Where our design goes beyond the spec", "vi": "Những chỗ thiết kế của mình vượt ngoài spec"}, "intro": {"en": "Check these with Thanh Hoang before building them.", "vi": "Cần xác nhận với Thanh Hoang trước khi làm."}, "blocks": [{"type": "table", "cols": [{"en": "Our design", "vi": "Thiết kế của mình"}, {"en": "What the spec says", "vi": "Spec nói gì"}, {"en": "What needs confirming", "vi": "Cần xác nhận"}], "rows": [[{"en": "Live preview on the canvas", "vi": "Preview trực tiếp trên canvas"}, {"en": "Only “display proposed changes”", "vi": "Chỉ ghi “hiển thị các thay đổi được đề xuất”"}, {"en": "Can the frontend show tokens that aren't saved yet?", "vi": "Frontend có hiển thị được token chưa lưu không?"}], [{"en": "Ticking changes on or off", "vi": "Bật/tắt từng thay đổi"}, {"en": "No rule for applying only some changes; partial failure rejects the whole set", "vi": "Chưa có quy tắc áp dụng một phần; khi có lỗi thì từ chối cả nhóm"}, {"en": "Can the merchant apply part of a proposal?", "vi": "Merchant có được áp dụng một phần đề xuất không?"}], [{"en": "Undo after Apply", "vi": "Undo sau khi Apply"}, {"en": "Not covered; Apply saves a draft", "vi": "Không có; Apply lưu bản nháp"}, {"en": "Undo = save a new change, or restore the old draft?", "vi": "Undo = lưu thay đổi mới, hay khôi phục bản nháp cũ?"}], [{"en": "Contrast warning", "vi": "Cảnh báo độ tương phản"}, {"en": "Not covered", "vi": "Không có"}, {"en": "Can the validation step return contrast results?", "vi": "Bước kiểm tra có trả về kết quả tương phản không?"}]]}]}, {"id": "decisions", "nav": {"en": "Decisions", "vi": "Quyết định"}, "title": {"en": "Open questions and decisions", "vi": "Câu hỏi còn mở và các quyết định"}, "blocks": [{"type": "table", "title": {"en": "Still undecided, and it affects the design", "vi": "Chưa được quyết định và ảnh hưởng đến thiết kế"}, "cols": [{"en": "Open question", "vi": "Câu hỏi còn mở"}, {"en": "Design impact", "vi": "Ảnh hưởng đến thiết kế"}], "rows": [[{"en": "Shop-wide settings (colors, fonts): same page + version flow, or a separate one?", "vi": "Thiết lập cả shop (màu, font): chung luồng theo trang + version, hay luồng riêng?"}, {"en": "What the context bar shows", "vi": "Context bar hiển thị gì"}], [{"en": "Two people editing at once (page changed after loading)", "vi": "Hai người cùng chỉnh sửa (trang đã thay đổi sau khi tải)"}, {"en": "Conflict / outdated state", "vi": "State xung đột / lỗi thời"}], [{"en": "Response-time targets", "vi": "Thời gian phản hồi mục tiêu"}, {"en": "How long thinking and streaming states last", "vi": "State “đang suy nghĩ” và “đang trả lời” kéo dài bao lâu"}], [{"en": "Per-shop request limits (numbers not set)", "vi": "Giới hạn số yêu cầu mỗi shop (chưa chốt con số)"}, {"en": "Rate-limit message and countdown", "vi": "Thông báo hết lượt và đếm ngược"}], [{"en": "Which AI model runs behind the JTL AI Gateway (integration testing planned for Nov 2026)", "vi": "Model AI nào chạy sau JTL AI Gateway (dự kiến test tích hợp tháng 11/2026)"}, {"en": "Image upload may be disabled, depending on the model", "vi": "Upload hình ảnh có thể bị vô hiệu hóa, tùy model"}]]}, {"type": "table", "title": {"en": "Already decided", "vi": "Đã quyết định"}, "cols": [{"en": "Question", "vi": "Câu hỏi"}, {"en": "Decision", "vi": "Quyết định"}], "rows": [[{"en": "How is page data fetched?", "vi": "Dữ liệu trang được lấy thế nào?"}, {"en": "Through the team's own MCP, built against the JTL AI Gateway.", "vi": "Qua MCP do team tự xây, làm trên JTL AI Gateway."}], [{"en": "Which AI provider and hosting region?", "vi": "Nhà cung cấp AI và khu vực hosting nào?"}, {"en": "JTL AI Gateway (requested by Karsten).", "vi": "JTL AI Gateway (Karsten đã yêu cầu)."}], [{"en": "Can the AI rewrite block text?", "vi": "AI có được sửa text trong block không?"}, {"en": "Yes, when the merchant asks (e.g. “Change the header to ABC”).", "vi": "Có, khi merchant yêu cầu (vd. “Đổi header thành ABC”)."}], [{"en": "What if one of several changes fails?", "vi": "Nếu một trong nhiều thay đổi bị lỗi thì sao?"}, {"en": "Reject the whole request; never apply part of it. The exact error format is still to be defined.", "vi": "Từ chối cả yêu cầu; không bao giờ áp dụng một phần. Định dạng lỗi cụ thể vẫn chưa được xác định."}]]}]}, {"id": "plan", "nav": {"en": "Build plan", "vi": "Kế hoạch"}, "title": {"en": "Implementation plan", "vi": "Kế hoạch triển khai"}, "intro": {"en": "Owner for all build tasks: Thanh Hoang. Design input is most useful at steps 5 and 6.", "vi": "Người phụ trách toàn bộ: Thanh Hoang. Đóng góp của design hữu ích nhất ở bước 5 và 6."}, "blocks": [{"type": "steps", "items": [{"t": {"en": "Define the AI tool interfaces from current Theme Builder behavior", "vi": "Định nghĩa giao diện công cụ AI dựa trên Theme Builder hiện tại"}}, {"t": {"en": "Build the tools", "vi": "Xây dựng các công cụ"}}, {"t": {"en": "Test the tools on their own", "vi": "Test riêng từng công cụ"}}, {"t": {"en": "Connect the tools to the AI model", "vi": "Kết nối công cụ với model AI"}}, {"t": {"en": "Check the AI's results and list needed design changes", "vi": "Kiểm tra kết quả AI và liệt kê thay đổi thiết kế cần thiết"}, "hl": true}, {"t": {"en": "Connect approved proposals to Theme Builder (review, confirm, save)", "vi": "Kết nối đề xuất đã duyệt với Theme Builder (xem lại, xác nhận, lưu)"}, "hl": true}, {"t": {"en": "Test the full flow end to end", "vi": "Test toàn bộ luồng từ đầu đến cuối"}}, {"t": {"en": "Roll out step by step", "vi": "Phát hành từng bước"}}, {"t": {"en": "Update the knowledge base and token contract from real results", "vi": "Cập nhật knowledge base và token contract theo kết quả thực tế"}}, {"t": {"en": "Monitoring: logs, metrics, traces, audit events", "vi": "Giám sát: log, metric, trace, audit event"}}]}, {"type": "callout", "tone": "info", "t": {"en": "Every request is logged with shop, page, version, what the AI understood and the outcome. Prompt text, images and personal data are not logged.", "vi": "Mỗi yêu cầu được ghi log với shop, trang, version, những gì AI hiểu và kết quả. Nội dung prompt, hình ảnh và dữ liệu cá nhân không được ghi log."}}]}, {"id": "glossary", "nav": {"en": "Glossary", "vi": "Thuật ngữ"}, "title": {"en": "Glossary", "vi": "Thuật ngữ"}, "blocks": [{"type": "table", "cols": [{"en": "Term", "vi": "Thuật ngữ"}, {"en": "Meaning", "vi": "Ý nghĩa"}], "rows": [["LLM", {"en": "The AI model that reads the request and proposes values.", "vi": "Model AI đọc yêu cầu và đề xuất giá trị."}], ["MCP", {"en": "Theme Builder MCP: the fixed tools the AI must use to read and check theme fields. It never saves.", "vi": "Theme Builder MCP: bộ công cụ cố định AI bắt buộc dùng để đọc và kiểm tra field. Không bao giờ lưu."}], ["External AI agent", {"en": "An AI outside the Shop Manager chat panel that connects to the same Theme Builder MCP tools. It follows the same validation and confirmation rules; how it authenticates is still open.", "vi": "Một AI nằm ngoài chat panel của Shop Manager, kết nối vào cùng bộ công cụ Theme Builder MCP. AI này tuân theo cùng quy tắc kiểm tra và xác nhận; cách xác thực vẫn chưa được quyết định."}], ["Token catalog", {"en": "The build's name for the list of editable fields and their limits.", "vi": "Tên bản build dùng cho danh sách field chỉnh sửa được và giới hạn của chúng."}], ["Token", {"en": "One named theme value, e.g. primary color, heading size, column count.", "vi": "Một giá trị theme có tên, vd. màu primary, cỡ heading, số cột."}], ["Token contract", {"en": "The list of which tokens exist and which values they allow.", "vi": "Danh sách các token tồn tại và giá trị chúng cho phép."}], ["Change set", {"en": "All changes proposed for one request. Applied together or not at all.", "vi": "Toàn bộ thay đổi đề xuất cho một yêu cầu. Áp dụng cùng lúc hoặc không áp dụng."}], ["pageId + version", {"en": "Which page and which version the request is about.", "vi": "Yêu cầu thuộc trang nào và version nào."}], ["Draft", {"en": "The working version. Apply saves into it; publishing is a separate step.", "vi": "Bản nháp đang làm việc. Apply lưu vào đây; publish là bước riêng."}], ["AI Gateway", {"en": "The interim JTL-provided access to an AI model.", "vi": "Kênh truy cập model AI tạm thời do JTL cung cấp."}], ["Puck", {"en": "The page-layout document format the editor uses.", "vi": "Định dạng tài liệu layout trang mà editor sử dụng."}]]}]}]}</script>
<script>
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const KEY='ai-technical-concept-kb-v1';
const DEFAULT=JSON.parse(document.getElementById('kb-data').textContent);
let DATA=DEFAULT, local=false;
try{const s=localStorage.getItem(KEY);if(s){DATA=JSON.parse(s);local=true;}}catch(e){}
const UI={
 en:{edit:'Edit',done:'Done',save:'Save HTML',reset:'Reset edits',saved:'Saved in this browser',source:'Source: Confluence',
  trOn:'Auto-translate on (on-device, Chrome)',trOff:'Auto-translate not available in this browser. The other language is flagged ● until you update it.',
  trDl:'Downloading translation model…',editHint:'Click any text to edit. When you leave a field, the other language updates automatically.',
  updated:'Other language updated',flagged:'Other language flagged ● for update',dl:'Downloaded — this file now contains your edits',
  stale:'Needs update to match the other language'},
 vi:{edit:'Sửa',done:'Xong',save:'Lưu HTML',reset:'Xóa chỉnh sửa',saved:'Đã lưu trong trình duyệt',source:'Nguồn: Confluence',
  trOn:'Tự dịch đang bật (trên máy, Chrome)',trOff:'Trình duyệt này không hỗ trợ tự dịch. Ngôn ngữ còn lại được đánh dấu ● cho đến khi bạn cập nhật.',
  trDl:'Đang tải model dịch…',editHint:'Nhấn vào bất kỳ đoạn chữ nào để sửa. Khi rời khỏi ô, ngôn ngữ còn lại tự cập nhật.',
  updated:'Đã cập nhật ngôn ngữ còn lại',flagged:'Ngôn ngữ còn lại được đánh dấu ● để cập nhật',dl:'Đã tải về — file này chứa các chỉnh sửa của bạn',
  stale:'Cần cập nhật cho khớp với ngôn ngữ còn lại'}
};
let lang='en', editing=false;
try{lang=localStorage.getItem(KEY+'-lang')||'en';}catch(e){}
const uiL=()=>lang==='vi'?'vi':'en';

/* ---------- leaf registry ---------- */
let REG=[];
function index(){REG=[];(function walk(o){if(Array.isArray(o))return o.forEach(walk);if(o&&typeof o==='object'){if('en' in o&&'vi' in o&&typeof o.en==='string'){o._id=REG.length;REG.push(o);return;}Object.values(o).forEach(walk);}})(DATA);}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function tx(v,L,tag='span',cls=''){
 if(v==null)return'';
 if(typeof v==='string')return `<${tag} class="${cls}">${fmt(v)}</${tag}>`;
 const st=v._stale===L?`<i class="stale" title="${UI[L].stale}"></i>`:'';
 return `<${tag} class="${cls}" data-p="${v._id}" data-l="${L}">${fmt(v[L])}</${tag}>${st}`;
}
const plain=v=>typeof v==='string'?v:v.en;

/* ---------- block renderers ---------- */
const R={
 bullets:(b,L)=>`${b.title?tx(b.title,L,'h4'):''}<ul class="bl">${b.items.map(i=>`<li>${i.b?tx(i.b,L,'b')+' ':''}${tx(i.t,L)}</li>`).join('')}</ul>`,
 facts:(b,L)=>`<div class="facts">${b.items.map(i=>`<div class="fact">${tx(i.k,L,'small')}${tx(i.v,L,'b')}</div>`).join('')}</div>`,
 table:(b,L)=>`${b.title?tx(b.title,L,'h4'):''}<div class="tw"><table><thead><tr>${b.cols.map(c=>tx(c,L,'th')).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&c.st?`<span class="st ${c.st}">${tx(c,L)}</span>`:tx(c,L)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
 turn:(b,L)=>`${b.title?tx(b.title,L,'h4'):''}<ol class="turn">${b.items.map((i,n)=>`<li><span class="tn">${n+1}</span><span class="who ${i.who}">${tx(i.w,L)}</span>${tx(i.t,L,'p')}</li>`).join('')}</ol>`,
 keys:(b,L)=>`<div class="keys">${b.items.map(i=>`<span><span class="st ${i.st}">${i.st==='built'?(L==='en'?'Built':'Đã có'):i.st==='gap'?(L==='en'?'Gap':'Thiếu'):(L==='en'?'AI text':'Do AI viết')}</span>${tx(i.t,L)}</span>`).join('')}</div>`,
 callout:(b,L)=>`<div class="callout">${tx(b.t,L)}</div>`,
 code:(b,L)=>`<div class="code">${tx(b.caption,L,'small')}<pre>${esc(b.code)}</pre></div>`,
 steps:(b,L)=>`${b.title?tx(b.title,L,'h4'):''}<ol class="steps">${b.items.map(i=>`<li class="${i.hl?'hl':''}">${tx(i.t,L)}</li>`).join('')}</ol>`,
 flows:(b,L)=>`<div class="flows">${b.items.map((f,n)=>`<div class="flow"><div class="fh"><span class="fn">${n+1}</span>${tx(f.t,L,'b')}<span class="pri ${f.pri.en.toLowerCase()}">${f.pri[L]}</span></div>${tx(f.d,L,'p')}${f.chains.map(c=>`<div class="chain">${c.map(s=>tx(s,L,'span','stp')).join('<span class="ar">→</span>')}</div>`).join('')}</div>`).join('')}</div>`,
 swimlane:(b,L)=>{const li=Object.fromEntries(b.lanes.map((l,i)=>[l.id,i]));
  return `<div class="sw"><div class="sw-g"><div class="sw-line"></div><div class="sw-h"></div>${b.lanes.map(l=>tx(l.label,L,'div','sw-h')).join('')}
  ${b.steps.map((s,i)=>`<div class="sw-n ${s.seen?'seen':''}"><span>${i+1}</span></div>${b.lanes.map((l,j)=>`<div class="sw-c">${j===li[s.lane]?`<div class="sw-card ${s.seen?'seen':''}">${tx(s.t,L)}${s.seen?`<span class="eye">◉ ${b.seenLabel[L]}</span>`:''}</div>`:''}</div>`).join('')}`).join('')}</div></div>`;},
 arch:(b,L)=>`<div class="arch-w"><div class="arch" data-arch>${b.nodes.map(n=>`<div class="node ${n.k}" data-node="${n.id}" style="grid-row:${n.r};grid-column:${n.c}">${tx(n.l,L)}</div>`).join('')}
  <svg></svg>${b.edges.map(e=>`<div class="elab" data-a="${e.a}" data-b="${e.b}">${tx(e.l,L)}</div>`).join('')}</div></div>`
};
function secHTML(s,i,L){return `<div class="colhead">${L==='en'?'ENGLISH':'TIẾNG VIỆT'}</div><div class="sec-h"><span class="sec-n">${i+1}</span>${tx(s.title,L,'h3')}</div>${s.intro?tx(s.intro,L,'p','intro'):''}${s.blocks.map(b=>R[b.type](b,L)).join('')}`;}
function render(){
 index();
 document.documentElement.lang=uiL();
 const m=DATA.meta;
 document.getElementById('barTitle').innerHTML=fmt(m.title[uiL()]);
 const hero=`<div class="hero"><h2>${lang==='both'?tx(m.title,'en')+' <span style="opacity:.5">/</span> '+tx(m.title,'vi'):tx(m.title,lang)}</h2><a href="${m.source}" target="_blank" rel="noopener">${UI[uiL()].source} ↗</a></div>`;
 document.getElementById('main').innerHTML=hero+DATA.sections.map((s,i)=>`<section class="sec-wrap" id="${s.id}"><div class="mirror ${lang==='both'?'two':''}">${(lang==='both'?['en','vi']:[lang]).map(L=>`<section class="sec">${secHTML(s,i,L)}</section>`).join('')}</div></section>`).join('');
 document.getElementById('toc').innerHTML=DATA.sections.map((s,i)=>`<a href="#${s.id}"><b>${i+1}</b>${esc(s.nav[uiL()])}</a>`).join('');
 document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 document.querySelector('#editBtn span').textContent=editing?UI[uiL()].done:UI[uiL()].edit;
 document.querySelector('#dlBtn span').textContent=UI[uiL()].save;
 setEditable();updateEditbar();
 requestAnimationFrame(drawArch);
}
function setEditable(){document.querySelectorAll('[data-p]').forEach(el=>{if(editing)el.setAttribute('contenteditable','plaintext-only');else el.removeAttribute('contenteditable');});}

/* ---------- architecture lines ---------- */
function drawArch(){document.querySelectorAll('[data-arch]').forEach(box=>{
 const bb=box.getBoundingClientRect(), svg=box.querySelector('svg');
 const rect=id=>{const r=box.querySelector(`[data-node="${id}"]`).getBoundingClientRect();return{x:r.left-bb.left+r.width/2,y:r.top-bb.top+r.height/2,w:r.width/2,h:r.height/2};};
 const edgeP=(c,dx,dy,pad)=>{const t=Math.min(dx?(c.w+pad)/Math.abs(dx):1e9,dy?(c.h+pad)/Math.abs(dy):1e9);return{x:c.x+dx*t,y:c.y+dy*t};};
 let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>`;
 box.querySelectorAll('.elab').forEach(lab=>{const A=rect(lab.dataset.a),B=rect(lab.dataset.b);const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const p1=edgeP(A,ux,uy,2),p2=edgeP(B,-ux,-uy,4);
  s+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>`;
  lab.style.left=((p1.x+p2.x)/2)+'px';lab.style.top=((p1.y+p2.y)/2)+'px';});
 svg.innerHTML=s;});}
addEventListener('resize',drawArch);

/* ---------- translation ---------- */
const TR={};let trState='unknown';
async function prepTranslator(){
 if(!('Translator' in self)){trState='off';updateEditbar();return;}
 try{for(const [a,b] of [['en','vi'],['vi','en']]){
  const av=await Translator.availability({sourceLanguage:a,targetLanguage:b});
  if(av==='unavailable'){trState='off';updateEditbar();return;}
  if(av!=='available'){trState='dl';updateEditbar();}
  TR[a+b]=await Translator.create({sourceLanguage:a,targetLanguage:b,monitor(m){m.addEventListener('downloadprogress',e=>{trState='dl';updateEditbar(Math.round(e.loaded*100));});}});
 } trState='on';}catch(e){trState='off';}
 updateEditbar();
}
async function translate(text,from,to){
 const t=TR[from+to];if(!t)throw 0;
 const parts=text.split(/(`[^`]+`)/);
 const out=await Promise.all(parts.map(p=>p.startsWith('`')||!p.trim()?p:t.translate(p)));
 return out.join('');
}
function updateEditbar(pct){
 const u=UI[uiL()];
 const st=trState==='on'?`<span class="chip ok"><i></i>${u.trOn}</span>`:trState==='dl'?`<span class="chip warn"><i></i>${u.trDl}${pct!=null?' '+pct+'%':''}</span>`:trState==='off'?`<span class="chip warn"><i></i>${u.trOff}</span>`:'';
 document.getElementById('editbar').innerHTML=`${u.editHint} &nbsp; ${st} ${local?` &nbsp; <span class="chip"><i style="background:var(--p)"></i>${u.saved}</span> <button class="btn" id="resetBtn" style="padding:2px 8px;margin-left:6px">${u.reset}</button>`:''}`;
 const rb=document.getElementById('resetBtn');if(rb)rb.onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}DATA=JSON.parse(JSON.stringify(DEFAULT));local=false;render();};
}

/* ---------- editing ---------- */
const main=document.getElementById('main');
main.addEventListener('focusin',e=>{const el=e.target.closest('[data-p]');if(!el||!editing)return;const v=REG[+el.dataset.p];el.textContent=v[el.dataset.l];el.dataset.orig=v[el.dataset.l];});
main.addEventListener('focusout',async e=>{
 const el=e.target.closest('[data-p]');if(!el||!editing)return;
 const v=REG[+el.dataset.p],L=el.dataset.l,O=L==='en'?'vi':'en';
 const txt=el.innerText.replace(/\n+$/,'').trim();
 el.innerHTML=fmt(txt||v[L]);
 if(!txt||txt===el.dataset.orig)return;
 v[L]=txt; if(v._stale===L)delete v._stale;
 persist();
 try{v[O]=await translate(txt,L,O);delete v._stale;persist();toast(UI[uiL()].updated);}
 catch(_){v._stale=O;persist();toast(UI[uiL()].flagged);}
 refreshLeaf(v);
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.closest('[data-p]')){e.preventDefault();e.target.blur();}});
function refreshLeaf(v){
 document.querySelectorAll(`[data-p="${v._id}"]`).forEach(el=>{if(el===document.activeElement)return;const L=el.dataset.l;el.innerHTML=fmt(v[L]);
  const nx=el.nextElementSibling;const has=nx&&nx.classList.contains('stale');
  if(v._stale===L&&!has)el.insertAdjacentHTML('afterend',`<i class="stale" title="${UI[L].stale}"></i>`);
  if(v._stale!==L&&has)nx.remove();
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');});
 if(v.en!==undefined)document.getElementById('toc').innerHTML=DATA.sections.map((s,i)=>`<a href="#${s.id}"><b>${i+1}</b>${esc(s.nav[uiL()])}</a>`).join('');
 drawArch();
}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>k==='_id'?undefined:v));}
function persist(){local=true;try{localStorage.setItem(KEY,JSON.stringify(clean(DATA)));}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}

/* ---------- controls ---------- */
document.getElementById('langSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem(KEY+'-lang',lang);}catch(_){}render();};
document.getElementById('editBtn').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);render();if(editing&&trState==='unknown')prepTranslator();};
document.getElementById('dlBtn').onclick=()=>{
 const json=JSON.stringify(clean(DATA)).replace(/</g,'\\u003c');
 const out=SRC.replace(/(<script id="kb-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='ai-technical-concept-knowledge-base.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(UI[uiL()].dl);
};
/* scrollspy */
const spy=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-80px 0px -70% 0px'});
render();
const obs=()=>document.querySelectorAll('.sec-wrap').forEach(s=>spy.observe(s));obs();
new MutationObserver(obs).observe(main,{childList:true});
</script>
</body>
</html>
